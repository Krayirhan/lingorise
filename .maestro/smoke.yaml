appId: com.lingorise.app
---
- launchApp:
    clearState: true
# A fresh install cold-starts the JS bundle and fetches the content catalogue
# before the welcome screen renders — on a resource-constrained CI emulator
# (no host GPU/CPU parity with a local dev machine) this reliably takes
# longer than Maestro's default retry window, unlike on a warmed-up local
# emulator. Wait explicitly for the real first screen instead of assuming
# it's already there.
- extendedWaitUntil:
    visible: "Başla"
    timeout: 30000
- tapOn: "Başla"
- tapOn: "Seviyemi seç"
- tapOn: "A1"
# Selecting a level card only marks it selected (LevelStep.tsx) — it does not
# auto-advance. A separate "<level> seviyesinde başla" button must be tapped
# to actually leave this step. The script previously skipped this and tried
# to tap ReadyStep's button directly, which was never on screen yet.
- tapOn: "seviyesinde başla"
# ReadyStep's real guest-start label is "Hemen Başla (Misafir Olarak) →"
# (src/i18n/onboarding.ts onboardingTr.startAsGuest) — the script previously
# looked for "Bahçeme Başla", which does not exist anywhere in the app copy.
- tapOn: "Hemen Başla"
- tapOn: "Pratik"
- assertVisible: "Bugün ne çalışmak istersin?"
