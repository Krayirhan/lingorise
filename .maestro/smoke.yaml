appId: com.lingorise.app
---
- launchApp:
    clearState: true
# Even after fixing two real unbounded network waits in the app itself
# (catalogueService.ts, AppBootstrap.tsx's auth wait), this assertion kept
# failing at exactly its own configured timeout every single time (45s,
# 90s, 150s, 35s twice) — and Maestro's OWN debug screenshot at the failure
# instant consistently showed the exact target button rendered, visible,
# enabled, with the exact expected text. The element was never missing.
# Remaining theory, now being tested directly: Maestro's `textRegex` may
# require the ENTIRE element text to match the pattern (Regex.matches, not
# Regex.find) — "Başla" as a bare pattern would then never match against
# the fuller string "Hemen Başla" no matter how long you wait, regardless
# of the app's actual load time. Wrapping every pattern here in explicit
# `.*...*` wildcards works under either matching semantics.
- extendedWaitUntil:
    visible: ".*Başla.*"
    timeout: 35000
- tapOn: ".*Başla.*"
- tapOn: "Seviyemi seç"
- tapOn: "A1"
# Selecting a level card only marks it selected (LevelStep.tsx) — it does not
# auto-advance. A separate advance button must be tapped to actually leave
# this step. Its label changed from "<level> seviyesinde başla" to
# "<level> · Hemen Başla" (LevelStep.tsx, accessibility pass) — updated
# accordingly. Anchored on "A1 ·" (the level this flow always selects) rather
# than the bare "Hemen Başla" tail, since that tail alone would repeat the
# exact same headline-collision bug already fixed below for ReadyStep.
- tapOn: ".*A1 ·.*"
# ReadyStep's real guest-start label is "Hemen Başla (Misafir Olarak) →"
# (src/i18n/onboarding.ts onboardingTr.startAsGuest) — the script previously
# looked for "Bahçeme Başla", which does not exist anywhere in the app copy.
# A later run proved even ".*Hemen Başla.*" is unsafe: Maestro's own log
# showed it tapping coordinate (540, 931) — nowhere near the button (which
# sits around y=2006) — landing instead on this same screen's headline
# "Hesap açmadan hemen başlayabilirsin.", because "hemen başla" is literally
# a case-insensitive substring of "hemen başlayabilirsin". Tapping that
# plain (non-interactive) heading text is a silent no-op: COMPLETED in the
# log, zero effect on screen, and every downstream step then executes
# against a screen that never moved. "Misafir" is unique to the real button.
- tapOn: ".*Misafir Olarak.*"
# Whether a native Android 13+ notification-permission dialog appears here
# depends on scheduleDailyReminder()'s async requestPermissionsAsync() call
# (outside the React tree, invisible to any RN selector) — dismiss it if it
# shows; optional so this is a no-op when the OS auto-grants/skips it.
- tapOn:
    text: "Allow|İzin Ver|İzin ver"
    optional: true
# onComplete lands on the home screen's bottom nav; the "Pratik" tab item
# likely carries additional accessible text (badges/state, same pattern as
# other tabs in this app) so the bare exact label doesn't full-match either
# — same fix as everything else on this page.
- tapOn: ".*Pratik.*"
- assertVisible: ".*Bugün ne çalışmak istersin?.*"
