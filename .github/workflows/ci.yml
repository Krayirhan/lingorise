name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      architecture: ${{ steps.architecture.outcome }}
      longFunctionReview: ${{ steps.long-function-review.outcome }}
      lint: ${{ steps.lint.outcome }}
      applicationTests: ${{ steps.application-tests.outcome }}
      fullTests: ${{ steps.full-tests.outcome }}
      coverage: ${{ steps.coverage.outcome }}
      firestoreRules: ${{ steps.firestore-rules.outcome }}
      diffCheck: ${{ steps.diff-check.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: typecheck
        run: npm run typecheck
      - id: architecture
        run: npm run check:architecture
      - id: long-function-review
        run: npm run check:long-function-review
      - id: lint
        run: npm run lint:check
      - id: application-tests
        run: npm run test:application
      - id: full-tests
        run: npm test
      - id: coverage
        run: npm run coverage
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore
          retention-days: 30
      - id: diff-check
        run: git diff --check
      # firebase-tools (used by test:rules' emulator) requires JDK 21+; the
      # runner's default Java is older, so this needs its own explicit setup
      # separate from android-build/e2e-smoke's JDK 17 (Gradle's requirement).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - id: firestore-rules
        run: npm run test:rules

  # roadmap 18-srs-flow-hardening.md DEPLOY-001 — the domain/rules tests above
  # never actually exercised the native Android build. A Gradle/manifest
  # misconfiguration could merge to main undetected until someone happened to
  # build a release locally. This uses the committed debug keystore (already
  # what release builds are signed with — see android/app/build.gradle) so no
  # secrets are needed to prove the release artifact still compiles.
  #
  # SUPPLY-QA-004 / GLOBAL-QA-009: this job's APK is a COMPILE-VERIFICATION
  # artifact only — it is never uploaded or distributed, and it is NOT the
  # production release artifact. The actual distributable production build is
  # a separate EAS `production` profile Android App Bundle (AAB), signed with
  # EAS/Play App Signing credentials this workflow has no access to and does
  # not attempt to reproduce (see eas.json, `05_SIGNING_AND_ARTIFACT_PROVENANCE.md`).
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # EXPO_PUBLIC_* vars are inlined into the JS bundle at build time by
      # Expo's Metro/bundleCommand step, not read at runtime — without a
      # .env file here the CI-built APK silently ships with an unconfigured
      # Firebase client, breaking the catalogue fetch (and anything else
      # that touches Firestore/Auth) on first launch. These are non-secret
      # Firebase Web client identifiers (security is enforced by
      # firestore.rules, not by hiding this config — see .env.example),
      # stored as repository variables rather than committed to source.
      - name: Write .env
        run: |
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}" >> .env
      # The Google Services Gradle plugin (needed by @react-native-firebase)
      # requires android/app/google-services.json. Like the .env values above
      # it is a non-secret client config kept as a repository variable.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository variable GOOGLE_SERVICES_JSON is not set (contents of android/app/google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build release APK
        id: android-build
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

  # The only real end-to-end UI check this project has was never wired into
  # CI (roadmap 18-srs-flow-hardening.md DEPLOY-001) — a broken runtime flow
  # could merge undetected even with every check above green.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write .env
        run: |
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}" >> .env
      # The Google Services Gradle plugin (needed by @react-native-firebase)
      # requires android/app/google-services.json. Like the .env values above
      # it is a non-secret client config kept as a repository variable.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository variable GOOGLE_SERVICES_JSON is not set (contents of android/app/google-services.json)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # A debug build was tried first for speed, but React Native debug
      # builds don't embed the JS bundle by default — they expect a live
      # Metro server, which doesn't exist in CI. That produced a native
      # "Unable to load script" error screen every time, which looked like a
      # timing/config issue in Maestro's text-only output until an actual
      # screenshot was captured and inspected. A release build always embeds
      # the bundle, so it actually has JS to run.
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      # Pinned to a specific released version (matches the version validated
      # locally against this project's own smoke test) instead of piping the
      # installer's floating "latest" into bash — a deterministic version
      # avoids an unreviewed upstream release silently changing CI behavior,
      # and reduces trust in the remote script to "run this exact, known
      # version" rather than "run whatever is live today" (SUPPLY-QA-003).
      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: "2.9.0"
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Two previous root-cause guesses (cold-start timing, missing Firebase
      # config) each looked plausible from the error alone but didn't fix it
      # — this captures an actual screenshot + full logcat from the CI
      # emulator at the point of failure so the next fix is based on what is
      # really on screen, not another inference from Maestro's text-only
      # error output.
      - name: Run Maestro smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro/smoke.yaml || echo "MAESTRO_FAILED=1" >> "$GITHUB_ENV"
            adb shell screencap -p /sdcard/ci_debug.png
            adb pull /sdcard/ci_debug.png ci_debug_screenshot.png
            adb shell uiautomator dump /sdcard/ci_debug_uiautomator.xml
            adb pull /sdcard/ci_debug_uiautomator.xml ci_debug_uiautomator.xml
            adb logcat -d > ci_debug_logcat.txt
            cp -r ~/.maestro/tests ci_debug_maestro_tests || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-debug
          path: |
            ci_debug_screenshot.png
            ci_debug_uiautomator.xml
            ci_debug_logcat.txt
            ci_debug_maestro_tests
          retention-days: 5
      - name: Fail if Maestro failed
        id: maestro-result
        if: env.MAESTRO_FAILED == '1'
        run: exit 1

  quality-score:
    if: always()
    needs: [verify, android-build, e2e-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage
        continue-on-error: true
      - name: Collect verification job outcomes
        shell: bash
        run: |
          mkdir -p .audit/quality
          cat > .audit/quality/ci-check-results.json <<'JSON'
          {
            "typecheck": "${{ needs.verify.outputs.typecheck }}",
            "architecture": "${{ needs.verify.outputs.architecture }}",
            "longFunctionReview": "${{ needs.verify.outputs.longFunctionReview }}",
            "lint": "${{ needs.verify.outputs.lint }}",
            "applicationTests": "${{ needs.verify.outputs.applicationTests }}",
            "fullTests": "${{ needs.verify.outputs.fullTests }}",
            "coverage": "${{ needs.verify.outputs.coverage }}",
            "androidBuild": "${{ needs.android-build.result }}",
            "firestoreRules": "${{ needs.verify.outputs.firestoreRules }}",
            "maestroSmoke": "${{ needs.e2e-smoke.result }}",
            "diffCheck": "${{ needs.verify.outputs.diffCheck }}"
          }
          JSON
      - name: Generate deterministic quality report
        env:
          QUALITY_SCORE_CHECK_RESULTS: .audit/quality/ci-check-results.json
        run: npm run score:quality
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-score
          path: .audit/quality/latest.json
          if-no-files-found: error
          retention-days: 30
